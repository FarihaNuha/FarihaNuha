name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Checkout existing output assets
        uses: actions/checkout@v4
        with:
          ref: output
          path: existing-output
        continue-on-error: true

      - name: Preserve profile summary cards
        run: |
          if [ -d "existing-output/profile-summary-card-output" ]; then
            mkdir -p dist/profile-summary-card-output
            cp -r existing-output/profile-summary-card-output/* dist/profile-summary-card-output/
          fi

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
